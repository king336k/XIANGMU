worker_processes 4;

events {
  worker_connections 1024;
}

http {
  map $sent_http_content_type $platform_document_cache {
    default "";
    "text/html" "no-cache";
  }
  include mime.types;

  default_type  application/octet-stream;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types application/javascript application/json application/manifest+json application/xml text/css text/plain text/xml image/svg+xml;

  set_real_ip_from        0.0.0.0/0;
  real_ip_recursive       on;
  real_ip_header          X-Forwarded-For;
  limit_req_zone          $binary_remote_addr zone=mylimit:10m rate=10r/s;

  map $uri $platform_log_uri {
    ~^/(auth/|reset-password/|spaces/reset-password/) [authentication];
    default $uri;
  }
  log_format platform_safe '$time_iso8601 $remote_addr $request_method $platform_log_uri $status $request_time';
  access_log /dev/stdout platform_safe;
  error_log /dev/stderr;

  server {
    listen 3000;
    add_header Cache-Control $platform_document_cache always;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location ^~ /assets/ {
      root /usr/share/nginx/html;
      try_files $uri =404;
      expires 1y;
    }

    location / {
      root   /usr/share/nginx/html;
      index  index.html index.htm;
      try_files $uri $uri/ /index.html;
    }
  }
}

