# 固定运行环境与业务部署包分离；仅通过部署入口启动。
services:
  web:
    image: engramproject/runtime-web:2026.11.10
    deploy:
      replicas: ${WEB_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
    - api
    - worker
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    volumes:
    - ${RELEASE_DIR:?请使用部署入口}/ProjectFront/build/client:/usr/share/nginx/html:ro
    - ${RELEASE_DIR:?请使用部署入口}/deploy/release/nginx.web.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 256
  space:
    image: docker.1panel.live/makeplane/plane-space:v1.4.3
    deploy:
      replicas: ${SPACE_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
    - api
    - worker
    - web
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
  admin:
    image: makeplane/plane-admin:v1.4.3
    deploy:
      replicas: ${ADMIN_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
    - api
    - web
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 256
  live:
    image: engramproject/runtime-live:2026.11.10
    environment:
      REDIS_HOST: ${REDIS_HOST:-plane-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?请先初始化本地配置}
    deploy:
      replicas: ${LIVE_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
    - api
    - web
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    volumes:
    - ${RELEASE_DIR:?请使用部署入口}/services/collaboration/dist:/app/apps/live/dist:ro
    command:
    - node
    - /app/apps/live/dist/start.mjs
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
  api:
    image: engramproject/runtime-api:2026.11.10
    command:
    - bash
    - ./bin/docker-entrypoint-api.sh
    deploy:
      replicas: ${API_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
    - logs_api:/code/plane/logs
    - quality_attachments:/code/quality-attachments
    - ${RELEASE_DIR:?请使用部署入口}/ProjectServer:/code:ro
    - static_assets:/code/plane/static-assets/collected-static
    - mediafiles:/code/mediafiles
    - ${RELEASE_DIR:?请使用部署入口}/deploy/release/seed_knowledge.py:/release-seed/seed_knowledge.py:ro
    - ${RELEASE_DIR:?请使用部署入口}/deploy/release/initial-knowledge:/release-seed/initial-knowledge:ro
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      CERT_EMAIL: ${CERT_EMAIL}
      CERT_ACME_CA: ${CERT_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      CERT_ACME_DNS: ${CERT_ACME_DNS}
      LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
      LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-engram-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?请先初始化本地配置}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-engram-local}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?请先初始化本地配置}
      REDIS_HOST: ${REDIS_HOST:-plane-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      PGHOST: ${PGHOST:-plane-db}
      PGDATABASE: ${POSTGRES_DB:-engramproject}
      POSTGRES_USER: ${POSTGRES_USER:-engram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先初始化本地配置}
      POSTGRES_DB: ${POSTGRES_DB:-engramproject}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data}
      WEB_URL: ${WEB_URL:-http://localhost:18890}
      DEBUG: ${DEBUG:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:18890}
      GUNICORN_WORKERS: 1
      USE_MINIO: ${USE_MINIO:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-engram}:${POSTGRES_PASSWORD:?请先初始化本地配置}@plane-db:5432/${POSTGRES_DB:-engramproject}
      SECRET_KEY: ${SECRET_KEY:?请先运行 python3 scripts/init_local_config.py}
      AMQP_URL: amqp://${RABBITMQ_USER:-engram}:${RABBITMQ_PASSWORD:?请先初始化本地配置}@plane-mq:5672/${RABBITMQ_VHOST:-engramproject}
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
      MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?请先初始化本地配置}
      WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      QUALITY_DAQ_REPORT_KEYS_JSON: ${QUALITY_DAQ_REPORT_KEYS_JSON:-{}}
      KNOWLEDGE_LLM_ALLOWED_HOSTS: ${KNOWLEDGE_LLM_ALLOWED_HOSTS:-api.openai.com}
      KNOWLEDGE_LLM_ALLOWED_HTTP_ORIGINS: ${KNOWLEDGE_LLM_ALLOWED_HTTP_ORIGINS:-}
      KNOWLEDGE_EMBEDDING_ALLOWED_HTTP_ORIGINS: http://builtin-embedding:18885
      KNOWLEDGE_BUILTIN_EMBEDDING_BASE_URL: http://builtin-embedding:18885/v1
      KNOWLEDGE_BUILTIN_EMBEDDING_API_KEY: ${BUILTIN_EMBEDDING_KEY:?请运行部署安装入口}
      KNOWLEDGE_BUILTIN_EMBEDDING_MODEL: bge-small-zh-v1.5
      DOCUMENT_OCR_BASE_URL: http://document-ocr:18886
      DOCUMENT_OCR_API_KEY: ${DOCUMENT_OCR_KEY:?请运行部署安装入口}
      DOCUMENT_OCR_ALLOWED_HTTP_ORIGINS: http://document-ocr:18886
      POSTHOG_API_KEY: ''
      POSTHOG_HOST: ''
      PYTHONDONTWRITEBYTECODE: '1'
      GUNICORN_CMD_ARGS: --access-logformat "%(m)s %(s)s %(L)s"
    depends_on:
    - plane-db
    - plane-redis
    - plane-mq
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    working_dir: /code
    networks:
    - default
    - helpers
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/',timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
  worker:
    image: engramproject/runtime-api:2026.11.10
    command:
    - bash
    - -c
    - python manage.py wait_for_db && python manage.py wait_for_migrations && exec
      celery -A plane worker -l info --concurrency=${BACKGROUND_CONCURRENCY:-2} --prefetch-multiplier=1
      -Q celery
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
    - logs_worker:/code/plane/logs
    - quality_attachments:/code/quality-attachments
    - ${RELEASE_DIR:?请使用部署入口}/ProjectServer:/code:ro
    - static_assets:/code/plane/static-assets/collected-static
