      POSTGRES_DB: ${POSTGRES_DB:-engramproject}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data}
    volumes:
    - pgdata:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    volumes:
    - redisdata:/data
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 256
  plane-mq:
    image: docker.1panel.live/library/rabbitmq:3.13.6-management-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:-plane-mq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-engram}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请先初始化本地配置}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-engramproject}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: ${RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS:-+S 2:2 +SDcpu 1 +SDio 1}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}
    volumes:
    - rabbitmq_data:/var/lib/rabbitmq
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 256
  plane-minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /export --console-address ":9090"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-engram-local}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?请先初始化本地配置}
    volumes:
    - uploads:/export
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 256
  proxy:
    image: docker.1panel.live/makeplane/plane-proxy:v1.4.3
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      CERT_EMAIL: ${CERT_EMAIL}
      CERT_ACME_CA: ${CERT_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      CERT_ACME_DNS: ${CERT_ACME_DNS}
      LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
      LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: :80
    ports:
    - ${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-18890}:80
    volumes:
    - ${RELEASE_DIR:?请使用部署入口}/deploy/release/Caddyfile:/etc/caddy/Caddyfile:ro
    - proxy_config:/config
    - proxy_data:/data
    depends_on:
    - web
    - api
    - space
    - admin
    - live
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 256
  diagnostic-worker:
    image: engramproject/runtime-diagnostic:2026.11.10
    command:
    - bash
    - -c
    - python manage.py wait_for_db && python manage.py wait_for_migrations && exec
      celery -A plane worker -l info --concurrency=${DIAGNOSTIC_CONCURRENCY:-2} --prefetch-multiplier=1
      -Q diagnostics
    deploy:
      replicas: ${DIAGNOSTIC_WORKERS:-1}
      restart_policy:
        condition: any
    volumes:
    - logs_diagnostics:/code/plane/logs
    - quality_attachments:/code/quality-attachments
    - ${RELEASE_DIR:?请使用部署入口}/ProjectServer:/code:ro
    - static_assets:/code/plane/static-assets/collected-static
    - mediafiles:/code/mediafiles
    - ${RELEASE_DIR:?请使用部署入口}/services/diagnostic-agent:/release-agent:ro
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      CERT_EMAIL: ${CERT_EMAIL}
      CERT_ACME_CA: ${CERT_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      CERT_ACME_DNS: ${CERT_ACME_DNS}
      LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
      LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-engram-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?请先初始化本地配置}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-engram-local}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?请先初始化本地配置}
      REDIS_HOST: ${REDIS_HOST:-plane-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      PGHOST: ${PGHOST:-plane-db}
      PGDATABASE: ${POSTGRES_DB:-engramproject}
      POSTGRES_USER: ${POSTGRES_USER:-engram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先初始化本地配置}
      POSTGRES_DB: ${POSTGRES_DB:-engramproject}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data}
      WEB_URL: ${WEB_URL:-http://localhost:18890}
      DEBUG: ${DEBUG:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:18890}
      GUNICORN_WORKERS: 1
      USE_MINIO: ${USE_MINIO:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-engram}:${POSTGRES_PASSWORD:?请先初始化本地配置}@plane-db:5432/${POSTGRES_DB:-engramproject}
      SECRET_KEY: ${SECRET_KEY:?请先运行 python3 scripts/init_local_config.py}
      AMQP_URL: amqp://${RABBITMQ_USER:-engram}:${RABBITMQ_PASSWORD:?请先初始化本地配置}@plane-mq:5672/${RABBITMQ_VHOST:-engramproject}
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
      MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?请先初始化本地配置}
      WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      QUALITY_DAQ_REPORT_KEYS_JSON: ${QUALITY_DAQ_REPORT_KEYS_JSON:-{}}
      KNOWLEDGE_LLM_ALLOWED_HOSTS: ${KNOWLEDGE_LLM_ALLOWED_HOSTS:-api.openai.com}
      KNOWLEDGE_LLM_ALLOWED_HTTP_ORIGINS: ${KNOWLEDGE_LLM_ALLOWED_HTTP_ORIGINS:-}
      KNOWLEDGE_EMBEDDING_ALLOWED_HTTP_ORIGINS: http://builtin-embedding:18885
      KNOWLEDGE_BUILTIN_EMBEDDING_BASE_URL: http://builtin-embedding:18885/v1
      KNOWLEDGE_BUILTIN_EMBEDDING_API_KEY: ${BUILTIN_EMBEDDING_KEY:?请运行部署安装入口}
      KNOWLEDGE_BUILTIN_EMBEDDING_MODEL: bge-small-zh-v1.5
      DOCUMENT_OCR_BASE_URL: http://document-ocr:18886
      DOCUMENT_OCR_API_KEY: ${DOCUMENT_OCR_KEY:?请运行部署安装入口}
      DOCUMENT_OCR_ALLOWED_HTTP_ORIGINS: http://document-ocr:18886
      POSTHOG_API_KEY: ''
      POSTHOG_HOST: ''
      PYTHONDONTWRITEBYTECODE: '1'
      DIAGNOSTIC_AGENT_PYTHON: /opt/diagnostic-agent/bin/python
      DIAGNOSTIC_AGENT_SCRIPT: /release-agent/runner.py
    depends_on:
    - api
    - plane-db
    - plane-redis
    - plane-mq
    stop_grace_period: 190s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    working_dir: /code
    networks:
    - default
    - helpers
    mem_limit: 768m
    memswap_limit: 768m
    pids_limit: 256
  builtin-embedding:
    profiles:
    - helpers
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
    networks:
    - helpers
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    image: engramproject/runtime-embedding:2026.11.10
    user: 10001:10001
    entrypoint:
    - python
    - /service/app.py
    environment:
      EMBEDDING_API_KEY: ${BUILTIN_EMBEDDING_KEY:?请运行部署入口}
      MODEL_DIR: /model
    volumes:
    - ${RELEASE_DIR:?请使用部署入口}/services/embedding-service/app.py:/service/app.py:ro
    - ${SHARED_DIR:?请使用部署入口}/models/bge-small-zh-v1.5:/model:ro
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request;urllib.request.urlopen('http://127.0.0.1:18885/health',timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
  document-ocr:
    profiles:
    - helpers
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 128
    restart: unless-stopped
    networks:
    - helpers
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'
    image: engramproject/runtime-ocr:2026.11.10
    user: 1000:1000
    entrypoint:
    - python
    - /service/server.py
    environment:
      DOCUMENT_OCR_API_KEY: ${DOCUMENT_OCR_KEY:?请运行部署入口}
      DOCUMENT_OCR_WORK_DIR: /work
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
    - ${RELEASE_DIR:?请使用部署入口}/services/document-ocr/server.py:/service/server.py:ro
    - ${RELEASE_DIR:?请使用部署入口}/services/document-ocr/extractor.py:/service/extractor.py:ro
    tmpfs:
    - /work:rw,noexec,nosuid,nodev,size=134217728,uid=1000,gid=1000,mode=0700
volumes:
  pgdata: null
  redisdata: null
  uploads: null
  logs_api: null
  logs_worker: null
  logs_beat-worker: null
  logs_migrator: null
  rabbitmq_data: null
  proxy_config: null
  proxy_data: null
  quality_attachments: {}
  logs_diagnostics: {}
  static_assets: {}
  mediafiles: {}
  beat_state: {}
name: engramproject
networks:
  helpers:
    internal: true
    ipam:
      config:
      - subnet: ${HELPERS_SUBNET:?请使用部署入口生成独立网段}
  default:
    ipam:
      config:
      - subnet: ${PLATFORM_SUBNET:?请使用部署入口生成独立网段}
