      POSTHOG_API_KEY: ''
      POSTHOG_HOST: ''
      PYTHONDONTWRITEBYTECODE: '1'
    depends_on:
    - api
    - plane-db
    - plane-redis
    - plane-mq
    logging:
      driver: json-file
