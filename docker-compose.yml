services:
  web:
    image: engramproject/web:local
    deploy:
      replicas: ${WEB_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - worker
    build:
      context: .
      dockerfile: deploy/local/Dockerfile.web
  space:
    image: docker.1panel.live/makeplane/plane-space:v1.4.3
    deploy:
      replicas: ${SPACE_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - worker
      - web
  admin:
    image: makeplane/plane-admin:v1.4.3
    deploy:
      replicas: ${ADMIN_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - web
  live:
    image: engramproject/live:local
    environment:
      REDIS_HOST: ${REDIS_HOST:-plane-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      API_BASE_URL: ${API_BASE_URL:-http://api:8000}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?请先初始化本地配置}
    deploy:
      replicas: ${LIVE_REPLICAS:-1}
      restart_policy:
        condition: any
    depends_on:
      - api
      - web
    build:
      context: .
      dockerfile: deploy/local/Dockerfile.live
  api:
    image: engramproject/api:local
    command: ./bin/docker-entrypoint-api.sh
    deploy:
      replicas: ${API_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
      - logs_api:/code/plane/logs
      - quality_attachments:/code/quality-attachments
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      CERT_EMAIL: ${CERT_EMAIL}
      CERT_ACME_CA: ${CERT_ACME_CA}
      CERT_ACME_DNS: ${CERT_ACME_DNS}
      LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
      LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-engram-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?请先初始化本地配置}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-engram-local}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?请先初始化本地配置}
      REDIS_HOST: ${REDIS_HOST:-plane-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      PGHOST: ${PGHOST:-plane-db}
      PGDATABASE: ${POSTGRES_DB:-engramproject}
      POSTGRES_USER: ${POSTGRES_USER:-engram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先初始化本地配置}
      POSTGRES_DB: ${POSTGRES_DB:-engramproject}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data}
      WEB_URL: ${WEB_URL:-http://localhost:18890}
      DEBUG: ${DEBUG:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:18890}
      GUNICORN_WORKERS: 1
      USE_MINIO: ${USE_MINIO:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-engram}:${POSTGRES_PASSWORD:?请先初始化本地配置}@plane-db:5432/${POSTGRES_DB:-engramproject}
      SECRET_KEY: ${SECRET_KEY:?请先运行 python3 scripts/init_local_config.py}
      AMQP_URL: amqp://${RABBITMQ_USER:-engram}:${RABBITMQ_PASSWORD:?请先初始化本地配置}@plane-mq:5672/${RABBITMQ_VHOST:-engramproject}
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
      MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?请先初始化本地配置}
      WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      QUALITY_DAQ_REPORT_KEYS_JSON: ${QUALITY_DAQ_REPORT_KEYS_JSON:-{}}
      KNOWLEDGE_LLM_ALLOWED_HTTP_ORIGINS: ${KNOWLEDGE_LLM_ALLOWED_HTTP_ORIGINS:-}
      KNOWLEDGE_EMBEDDING_ALLOWED_HTTP_ORIGINS: ${KNOWLEDGE_EMBEDDING_ALLOWED_HTTP_ORIGINS:-}
      KNOWLEDGE_BUILTIN_EMBEDDING_BASE_URL: ${KNOWLEDGE_BUILTIN_EMBEDDING_BASE_URL:-}
      KNOWLEDGE_BUILTIN_EMBEDDING_API_KEY: ${KNOWLEDGE_BUILTIN_EMBEDDING_API_KEY:-}
      KNOWLEDGE_BUILTIN_EMBEDDING_MODEL: ${KNOWLEDGE_BUILTIN_EMBEDDING_MODEL:-bge-small-zh-v1.5}
      DOCUMENT_OCR_BASE_URL: ${DOCUMENT_OCR_BASE_URL:-}
      DOCUMENT_OCR_API_KEY: ${DOCUMENT_OCR_API_KEY:-}
      DOCUMENT_OCR_ALLOWED_HTTP_ORIGINS: ${DOCUMENT_OCR_ALLOWED_HTTP_ORIGINS:-}
      POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
    build:
      context: .
      dockerfile: deploy/local/Dockerfile.api
  worker:
    image: engramproject/api:local
    command:
      - bash
      - -c
      - python manage.py wait_for_db && python manage.py wait_for_migrations && exec
        celery -A plane worker -l info --concurrency=${BACKGROUND_CONCURRENCY:-2} --prefetch-multiplier=1
        -Q celery
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
      - logs_worker:/code/plane/logs
      - quality_attachments:/code/quality-attachments
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      CERT_EMAIL: ${CERT_EMAIL}
      CERT_ACME_CA: ${CERT_ACME_CA}
      CERT_ACME_DNS: ${CERT_ACME_DNS}
      LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
      LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-engram-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?请先初始化本地配置}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-engram-local}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?请先初始化本地配置}
      REDIS_HOST: ${REDIS_HOST:-plane-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      PGHOST: ${PGHOST:-plane-db}
      PGDATABASE: ${POSTGRES_DB:-engramproject}
      POSTGRES_USER: ${POSTGRES_USER:-engram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先初始化本地配置}
      POSTGRES_DB: ${POSTGRES_DB:-engramproject}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data}
      WEB_URL: ${WEB_URL:-http://localhost:18890}
      DEBUG: ${DEBUG:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:18890}
      GUNICORN_WORKERS: 1
      USE_MINIO: ${USE_MINIO:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-engram}:${POSTGRES_PASSWORD:?请先初始化本地配置}@plane-db:5432/${POSTGRES_DB:-engramproject}
      SECRET_KEY: ${SECRET_KEY:?请先运行 python3 scripts/init_local_config.py}
      AMQP_URL: amqp://${RABBITMQ_USER:-engram}:${RABBITMQ_PASSWORD:?请先初始化本地配置}@plane-mq:5672/${RABBITMQ_VHOST:-engramproject}
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
      MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?请先初始化本地配置}
      WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      QUALITY_DAQ_REPORT_KEYS_JSON: ${QUALITY_DAQ_REPORT_KEYS_JSON:-{}}
      KNOWLEDGE_LLM_ALLOWED_HTTP_ORIGINS: ${KNOWLEDGE_LLM_ALLOWED_HTTP_ORIGINS:-}
      KNOWLEDGE_EMBEDDING_ALLOWED_HTTP_ORIGINS: ${KNOWLEDGE_EMBEDDING_ALLOWED_HTTP_ORIGINS:-}
      KNOWLEDGE_BUILTIN_EMBEDDING_BASE_URL: ${KNOWLEDGE_BUILTIN_EMBEDDING_BASE_URL:-}
      KNOWLEDGE_BUILTIN_EMBEDDING_API_KEY: ${KNOWLEDGE_BUILTIN_EMBEDDING_API_KEY:-}
      KNOWLEDGE_BUILTIN_EMBEDDING_MODEL: ${KNOWLEDGE_BUILTIN_EMBEDDING_MODEL:-bge-small-zh-v1.5}
      DOCUMENT_OCR_BASE_URL: ${DOCUMENT_OCR_BASE_URL:-}
      DOCUMENT_OCR_API_KEY: ${DOCUMENT_OCR_API_KEY:-}
      DOCUMENT_OCR_ALLOWED_HTTP_ORIGINS: ${DOCUMENT_OCR_ALLOWED_HTTP_ORIGINS:-}
      POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
    build:
      context: .
      dockerfile: deploy/local/Dockerfile.api
  beat-worker:
    image: engramproject/api:local
    command: ./bin/docker-entrypoint-beat.sh
    deploy:
      replicas: ${BEAT_WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
    volumes:
      - logs_beat-worker:/code/plane/logs
      - quality_attachments:/code/quality-attachments
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      CERT_EMAIL: ${CERT_EMAIL}
      CERT_ACME_CA: ${CERT_ACME_CA}
      CERT_ACME_DNS: ${CERT_ACME_DNS}
      LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
      LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-engram-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?请先初始化本地配置}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-engram-local}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?请先初始化本地配置}
      REDIS_HOST: ${REDIS_HOST:-plane-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      PGHOST: ${PGHOST:-plane-db}
      PGDATABASE: ${POSTGRES_DB:-engramproject}
      POSTGRES_USER: ${POSTGRES_USER:-engram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先初始化本地配置}
      POSTGRES_DB: ${POSTGRES_DB:-engramproject}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data}
      WEB_URL: ${WEB_URL:-http://localhost:18890}
      DEBUG: ${DEBUG:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:18890}
      GUNICORN_WORKERS: 1
      USE_MINIO: ${USE_MINIO:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-engram}:${POSTGRES_PASSWORD:?请先初始化本地配置}@plane-db:5432/${POSTGRES_DB:-engramproject}
      SECRET_KEY: ${SECRET_KEY:?请先运行 python3 scripts/init_local_config.py}
      AMQP_URL: amqp://${RABBITMQ_USER:-engram}:${RABBITMQ_PASSWORD:?请先初始化本地配置}@plane-mq:5672/${RABBITMQ_VHOST:-engramproject}
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
      MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?请先初始化本地配置}
      WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      QUALITY_DAQ_REPORT_KEYS_JSON: ${QUALITY_DAQ_REPORT_KEYS_JSON:-{}}
      KNOWLEDGE_LLM_ALLOWED_HTTP_ORIGINS: ${KNOWLEDGE_LLM_ALLOWED_HTTP_ORIGINS:-}
      KNOWLEDGE_EMBEDDING_ALLOWED_HTTP_ORIGINS: ${KNOWLEDGE_EMBEDDING_ALLOWED_HTTP_ORIGINS:-}
      KNOWLEDGE_BUILTIN_EMBEDDING_BASE_URL: ${KNOWLEDGE_BUILTIN_EMBEDDING_BASE_URL:-}
      KNOWLEDGE_BUILTIN_EMBEDDING_API_KEY: ${KNOWLEDGE_BUILTIN_EMBEDDING_API_KEY:-}
      KNOWLEDGE_BUILTIN_EMBEDDING_MODEL: ${KNOWLEDGE_BUILTIN_EMBEDDING_MODEL:-bge-small-zh-v1.5}
      DOCUMENT_OCR_BASE_URL: ${DOCUMENT_OCR_BASE_URL:-}
      DOCUMENT_OCR_API_KEY: ${DOCUMENT_OCR_API_KEY:-}
      DOCUMENT_OCR_ALLOWED_HTTP_ORIGINS: ${DOCUMENT_OCR_ALLOWED_HTTP_ORIGINS:-}
      POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
    build:
      context: .
      dockerfile: deploy/local/Dockerfile.api
  migrator:
    image: engramproject/api:local
    command: ./bin/docker-entrypoint-migrator.sh
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3
    volumes:
      - logs_migrator:/code/plane/logs
      - quality_attachments:/code/quality-attachments
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      CERT_EMAIL: ${CERT_EMAIL}
      CERT_ACME_CA: ${CERT_ACME_CA}
      CERT_ACME_DNS: ${CERT_ACME_DNS}
      LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
      LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-engram-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?请先初始化本地配置}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-engram-local}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?请先初始化本地配置}
      REDIS_HOST: ${REDIS_HOST:-plane-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
      PGHOST: ${PGHOST:-plane-db}
      PGDATABASE: ${POSTGRES_DB:-engramproject}
      POSTGRES_USER: ${POSTGRES_USER:-engram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先初始化本地配置}
      POSTGRES_DB: ${POSTGRES_DB:-engramproject}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data}
      WEB_URL: ${WEB_URL:-http://localhost:18890}
      DEBUG: ${DEBUG:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:18890}
      GUNICORN_WORKERS: 1
      USE_MINIO: ${USE_MINIO:-1}
      DATABASE_URL: postgresql://${POSTGRES_USER:-engram}:${POSTGRES_PASSWORD:?请先初始化本地配置}@plane-db:5432/${POSTGRES_DB:-engramproject}
      SECRET_KEY: ${SECRET_KEY:?请先运行 python3 scripts/init_local_config.py}
      AMQP_URL: amqp://${RABBITMQ_USER:-engram}:${RABBITMQ_PASSWORD:?请先初始化本地配置}@plane-mq:5672/${RABBITMQ_VHOST:-engramproject}
      API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
      MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?请先初始化本地配置}
      WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
      WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
      QUALITY_DAQ_REPORT_KEYS_JSON: ${QUALITY_DAQ_REPORT_KEYS_JSON:-{}}
      KNOWLEDGE_LLM_ALLOWED_HTTP_ORIGINS: ${KNOWLEDGE_LLM_ALLOWED_HTTP_ORIGINS:-}
      KNOWLEDGE_EMBEDDING_ALLOWED_HTTP_ORIGINS: ${KNOWLEDGE_EMBEDDING_ALLOWED_HTTP_ORIGINS:-}
      KNOWLEDGE_BUILTIN_EMBEDDING_BASE_URL: ${KNOWLEDGE_BUILTIN_EMBEDDING_BASE_URL:-}
      KNOWLEDGE_BUILTIN_EMBEDDING_API_KEY: ${KNOWLEDGE_BUILTIN_EMBEDDING_API_KEY:-}
      KNOWLEDGE_BUILTIN_EMBEDDING_MODEL: ${KNOWLEDGE_BUILTIN_EMBEDDING_MODEL:-bge-small-zh-v1.5}
      DOCUMENT_OCR_BASE_URL: ${DOCUMENT_OCR_BASE_URL:-}
      DOCUMENT_OCR_API_KEY: ${DOCUMENT_OCR_API_KEY:-}
      DOCUMENT_OCR_ALLOWED_HTTP_ORIGINS: ${DOCUMENT_OCR_ALLOWED_HTTP_ORIGINS:-}
      POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
    depends_on:
      - plane-db
      - plane-redis
    build:
      context: .
      dockerfile: deploy/local/Dockerfile.api
  plane-db:
    image: docker.1panel.live/library/postgres:15.7-alpine
    command: postgres -c 'max_connections=1000'
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      PGHOST: ${PGHOST:-plane-db}
      PGDATABASE: ${PGDATABASE:-plane}
      POSTGRES_USER: ${POSTGRES_USER:-engram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先初始化本地配置}
      POSTGRES_DB: ${POSTGRES_DB:-engramproject}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PGDATA: ${PGDATA:-/var/lib/postgresql/data}
    volumes:
      - pgdata:/var/lib/postgresql/data
  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    volumes:
      - redisdata:/data
  plane-mq:
    image: docker.1panel.live/library/rabbitmq:3.13.6-management-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      RABBITMQ_HOST: ${RABBITMQ_HOST:-plane-mq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-engram}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?请先初始化本地配置}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-engramproject}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: ${RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS:-+S 2:2 +SDcpu 1 +SDio 1}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  plane-minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /export --console-address ":9090"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-engram-local}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?请先初始化本地配置}
    volumes:
      - uploads:/export
  proxy:
    image: docker.1panel.live/makeplane/plane-proxy:v1.4.3
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      CERT_EMAIL: ${CERT_EMAIL}
      CERT_ACME_CA: ${CERT_ACME_CA}
      CERT_ACME_DNS: ${CERT_ACME_DNS}
      LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
      LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: :80
    ports:
      - 127.0.0.1:${HTTP_PORT:-18890}:80
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - proxy_config:/config
      - proxy_data:/data
    depends_on:
      - web
      - api
      - space
      - admin
      - live
  diagnostic-worker:
    image: engramproject/diagnostic-worker:local
    command:
      - bash
      - -c
      - python manage.py wait_for_db && python manage.py wait_for_migrations && exec
        celery -A plane worker -l info --concurrency=${DIAGNOSTIC_CONCURRENCY:-2} --prefetch-multiplier=1
        -Q diagnostics
    deploy:
      replicas: ${DIAGNOSTIC_WORKERS:-1}
      restart_policy:
        condition: any
    volumes:
      - logs_diagnostics:/code/plane/logs
      - quality_attachments:/code/quality-attachments
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      CERT_EMAIL: ${CERT_EMAIL}
      CERT_ACME_CA: ${CERT_ACME_CA}
      CERT_ACME_DNS: ${CERT_ACME_DNS}
      LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
      LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-engram-local}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?请先初始化本地配置}
