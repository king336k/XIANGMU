<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img">
<title>技术员操作指南操作示意图</title>
<desc>接收交接并核对本人是当前技术负责人。；读取附件和诊断，补齐证据后编写修复方案。；提交方案审核，处理退回意见后重新提交。；完成修复，选择人工验证或用例回归，登记版本、要求与测试员。；测试失败退回时继续修复；方案或版本变化后安排新轮次。</desc>
