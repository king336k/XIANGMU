<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img">
<title>成员、权限与账号操作示意图</title>
<desc>管理员创建账号，选择工作区或指定项目的访问范围。；在“成员与权限”核对工作区成员、项目成员和对应业务岗位。；用自己的平台账号登录，查看项目及“我的工作”入口。；缺少操作权限时由管理员或项目经理检查范围、岗位和当前记录状态。</desc>
<rect width="1200" height="650" rx="18" fill="#f4f7f7"/>
<rect x="0" y="0" width="1200" height="110" rx="18" fill="#164e55"/>
<rect x="0" y="80" width="1200" height="30" fill="#164e55"/>
<g font-family="Noto Sans CJK SC, Microsoft YaHei, sans-serif">
<text x="40" y="43" fill="#b9d9dc" font-size="15">TranscEngram · 公共操作 / 操作示意</text>
<text x="40" y="82" fill="white" font-size="29" font-weight="700">成员、权限与账号</text>
<rect x="40" y="138" width="352" height="142" rx="10" fill="white" stroke="#cfddde"/>
<circle cx="68" cy="167" r="15" fill="#e2f1ed"/>
<text x="68" y="173" text-anchor="middle" font-size="17" font-weight="700" fill="#176b59">1</text>
<text x="94" y="172" font-size="18" fill="#263d42">管理员创建账号，选择工作区或指定</text>
<text x="94" y="197" font-size="18" fill="#263d42">项目的访问范围。</text>
<text x="402" y="219" font-size="23" fill="#769a9d">→</text>
<rect x="424" y="138" width="352" height="142" rx="10" fill="white" stroke="#cfddde"/>
<circle cx="452" cy="167" r="15" fill="#e2f1ed"/>
<text x="452" y="173" text-anchor="middle" font-size="17" font-weight="700" fill="#176b59">2</text>
<text x="478" y="172" font-size="18" fill="#263d42">在“成员与权限”核对工作区成员、</text>
<text x="478" y="197" font-size="18" fill="#263d42">项目成员和对应业务岗位。</text>
<text x="786" y="219" font-size="23" fill="#769a9d">→</text>
<rect x="808" y="138" width="352" height="142" rx="10" fill="white" stroke="#cfddde"/>
<circle cx="836" cy="167" r="15" fill="#e2f1ed"/>
<text x="836" y="173" text-anchor="middle" font-size="17" font-weight="700" fill="#176b59">3</text>
<text x="862" y="172" font-size="18" fill="#263d42">用自己的平台账号登录，查看项目及</text>
<text x="862" y="197" font-size="18" fill="#263d42">“我的工作”入口。</text>
<rect x="40" y="308" width="352" height="142" rx="10" fill="white" stroke="#cfddde"/>
<circle cx="68" cy="337" r="15" fill="#e2f1ed"/>
<text x="68" y="343" text-anchor="middle" font-size="17" font-weight="700" fill="#176b59">4</text>
<text x="94" y="342" font-size="18" fill="#263d42">缺少操作权限时由管理员或项目经理</text>
<text x="94" y="367" font-size="18" fill="#263d42">检查范围、岗位和当前记录状态。</text>
<rect x="40" y="498" width="1120" height="105" rx="10" fill="#edf3f0"/>
<text x="60" y="529" font-size="17" font-weight="700" fill="#176b59">完成前核对</text>
<text x="60" y="555" font-size="18" fill="#334c49">采集员不是独立平台业务岗位。</text>
<text x="60" y="580" font-size="18" fill="#334c49">项目经理不自动拥有技术员编写方案或测试员执行测试的权限，兼任岗位后按能力并集生效。</text>
<text x="40" y="632" font-size="14" fill="#6d8083">按 2026/11/15 平台操作整理 · 示意图不包含真实业务数据 · 具体权限以当前账号为准</text>
</g></svg>